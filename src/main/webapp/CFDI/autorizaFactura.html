<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Autoriza CFDI</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css" rel="stylesheet">

	<style>
		h1 {
			font-size: 1.3em;
			font-weight: normal;
			line-height: 1.6em;
			color: #4E6CA3;
			border-bottom: 1px solid #B0BED9;
			clear: both;
			margin-top: 0px;
		}
	</style>
</head>

<body>
	<div class="container-fluid">
		<div>
			<h1>Timbra Factura</h1>
		</div>
		<div class="mt-3 ">
			<table id="tablaCfdi" class="table table-striped table-bordered nowrap responsive">
				<thead>
					<tr>
						<th>ID</th>
						<th>RFC Receptor</th>
						<th>Nombre Receptor</th>
						<th>Total</th>
						<th>Serie</th>
						<th>Folio</th>
						<th>Version</th>
						<th>Fecha Emisi&oacute;n</th>
					</tr>
				</thead>
				<tbody>
				</tbody>
			</table>
		</div>

		<!-- Card de Acciones -->
		<div class="d-flex justify-content-center">
			<div class="card mt-3 w-50">
				<div class="card-header">Acciones</div>
				<div class="card-body">
					<div class="d-flex justify-content-center">
						<button id="btnTimbrar" class="btn btn-success" onclick="stamp()" data-bs-toggle="tooltip"
							title="Seleccione las facturas a timbrar o eliminar">Timbrar</button>
							&nbsp;
						<button id="btnEliminar" class="btn btn-danger" onclick="cancelCFDI()" data-bs-toggle="tooltip"
							title="Seleccione las facturas a timbrar o eliminar">Eliminar</button>
					</div>
				</div>
			</div>
		</div>

	</div>


	<script src="https://code.jquery.com/jquery-3.6.1.js"
		integrity="sha256-3zlB5s2uwoUzrXK3BT7AX3FyvojsraNFxCc2vC/7pNI=" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
	<script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
	<script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script src="js/autorizaFactura.js"></script>


</body>

</html>
