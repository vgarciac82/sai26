<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cambia Contrato a RESICO</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" >
	<link href="../../css/sai.css" rel="stylesheet" >
	<link href="https://cdn.datatables.net/1.13.2/css/jquery.dataTables.css" rel="stylesheet" type="text/css">
</head>
<body>
	<div class="container">

		<div class="row">
			<div class="col-12">
				<h1>Cambia Contrato a RESICO</h1>
			</div>
		</div>


		<div class="row m-3">
			<div class="col-6">
				<label for="contractNumber">Contrato</label>
				<input type="text" id="contractNumber" name="contractNumber" class="form-control" />
			</div>

			<div class="col-6">
				<label for="rfc">RFC </label>
				<input type="text" id="rfc" name="rfc" class="form-control" />
			</div>
			<div class="col-8">
				<label for="businessName">Razón Social</label>
				<input type="text" id="businessName" name="businessName" class="form-control" />
			</div>
		</div>

		<div class="row m-3">
			<div class="col-12 text-center"">
				<button id="btnSearch" name="btnSearch" class="btn btn-primary">Buscar</button>
			</div>
		</div>
		
 
		<div class="row m-3" >
			<div class="col-12">
				<table id="tblContracts" class="display responsive nowrap" style="width:100%">
					<thead>
						<tr>
							<th>Contrato</th>
							<th>RFC</th>
							<th>Beneficiario</th>
							<th>Unidad Responsable</th>
						</tr>
					</thead>
					<tbody>
					</tbody>
				</table>
			</div>
		</div>
		
		<div class="row m-3" >
			<div class="col-12 text-center">
				<button type="button" class="btn btn-primary" id="updateBtn">Cambiar a RESICO</button>
			</div>
		</div>


	</div>
 
	
	<script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
	<script src="https://cdn.datatables.net/1.13.2/js/jquery.dataTables.js" type="text/javascript" charset="utf8"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" ></script>
	<script src="https://kit.fontawesome.com/aad2c3aad1.js" ></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script src="../js/jquery.blockUI-2.70.0.js"></script>
	<script type="text/javascript" src="../js/crud.js"></script>
	<script type="text/javascript" src="js/ContractHelper.js"></script>
	<script type="text/javascript" src="js/TaxChange.js"></script>

	
	<script type="text/javascript">
		$.fn.dataTable.ext.legacy.ajax = true;
		const dataTableBaseURL = window.location.protocol + "//" + window.location.host + "/" + window.location.pathname.split("/")[1];
		let dtResult;

		$(document).ready(function () {
			console.log("initiliazing...");


			$("#btnSearch").on("click", function () {
				
				let contractNumber = $("#contractNumber").val();
				let rfc = $("#rfc").val();
				let businessName = $("#businessName").val();
				let cond = "";
				let token = "";
				if( contractNumber || rfc || businessName ){
					

					if( contractNumber ){
						cond += "cidcontrato like'%" + contractNumber + "%'";
						token = " AND ";
					}
					if( rfc ){
						cond += token + " cidrfc like'%" + rfc + "%'";
						token = " AND ";
					}
					if( businessName ){ 
						cond += token + " crazonsocial like '%" + businessName + "%'";
					}

					cond += token + " cidtiporetencion = 4 ";
				
					cond = encodeURIComponent(cond);
					dtResult.ajax.url(dataTableBaseURL + "/crud?rt=t&ql=v_Contratos_ISR&qw=" + cond ).load();
				}else{
					Swal.fire({
						icon: 'error',
						title: 'Oops...',
						text: 'Debe ingresar al menos un criterio de busqueda!',
					});
				}
			});
 

			dtResult = $('#tblContracts').DataTable({
				"retrieve": true,
				"destroy": true,
				"serverSide": true,
				"scrollX": true,
				"searching": false,
				"processing": true,
				"ajax": {
					url: dataTableBaseURL + "/crud?rt=t&ql=v_Contratos_ISR&qw=1<>1",
					type: 'POST',
				},
				"aoColumns": [
					{ "name": "cidcontrato" },
					{ "name": "cidrfc" },
					{ "name": "crazonsocial" },
					{ "name": "cidunidadadministrativa" } 
				]
			});	

			dtResult.on( 'draw', function () {
				let isEmpty = dtResult.rows().count() === 0;
				if( isEmpty ){
					$("#updateBtn").prop("disabled",true);

					let contractNumber = $("#contractNumber").val();
					let rfc = $("#rfc").val();
					let businessName = $("#businessName").val();

					if( contractNumber || rfc || businessName ){
						Swal.fire({
							icon: 'info',
							title: 'No se encontraron resultados',
							text: 'El contrato no cuenta con retencion ISR o no existe. Intenta con otros criterios de búsqueda',
						});
					}
				}else 
					$("#updateBtn").prop("disabled",false);
			} );

			
			$('#tblContracts tbody').on('click', 'tr', function () {
		        if ($(this).hasClass('selected')) {
		            $(this).removeClass('selected');
		        } else {
		        	dtResult.$('tr.selected').removeClass('selected');
		            $(this).addClass('selected');
		        }
		    });

			$("#updateBtn").on("click",function(){
				updateBtnAction();
			});
			    
		});
		
		const updateBtnAction = function() {

			console.log(dtResult.row('.selected') );
			if( dtResult.row('.selected').data() ){

				Swal.fire({
					title: '¿Estás seguro?',
					text: "Se cambiará el tipo de retención a RESICO",
					icon: 'warning',
					showCancelButton: true,
					confirmButtonColor: '#3085d6',
					cancelButtonColor: '#d33',
					cancelButtonText: 'Cancelar',
					confirmButtonText: 'Sí, cambiar!'
				}).then((result) => {
					if (result.isConfirmed) {
						
						let data = dtResult.row('.selected').data();
						let contractId = data[0];
						changeTaxType(contractId);
				
					} 
				});
				
			}else{
				Swal.fire({
					icon: 'error',
					title: 'Oops...',
					text: 'Selecciona un contrato',
				});
			}
			


		}


		const changeTaxType = function(contractId){
			$.ajax({
				url:"../../contracts/diverse/updateRESICO?contractId="+contractId,
				type: "PUT",
				contentType: "application/x-www-form-urlencoded; charset=UTF-8;",
				dataType: "json",
				beforeSend:function(){$.blockUI("Procesando...");},
				complete:function(){$.unblockUI();},
				success: function (response) {
					console.log(response);
					clearScreen(); 
						Swal.fire({
							icon: 'success',
							title: 'Cambio realizado',
							text: 'Se ha cambiado el tipo de retención',
						});
						dtResult.ajax.reload();
					 
				},
				error: function (jqXHR, textStatus, errorThrown) {
					Swal.fire({
						icon: 'error',
						title: 'Oops...',
						text: 'Algo salió mal',
					});
					dtResult.ajax.reload();
					console.log(jqXHR);
					console.log(textStatus);
					console.log(errorThrown);
				}
			});
		}
		
		const clearScreen = function(){
			$("#contractNumber").val("");
			$("#rfc").val("");
			$("#businessName").val("");
			
			let cond =  encodeURIComponent("1<>1");
			dtResult.ajax.url(dataTableBaseURL + "/crud?rt=t&ql=v_Contratos_ISR&qw=" + cond ).load();
		}

	</script>
</body>
</html>
