<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alta Rápida de proveedores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous" />
  <link href="../css/sai.css" rel="stylesheet" />
</head>

<body>
  <div class="container mt-3 justify-content-center">
    <h1>Alta rapida de proveedores.</h1>
    <form>
      <div class="row g-3 justify-content-sm-end mb-3">
        <div class="col-sm-1 justify-content-sm-end text-end">
          <label for="folio" class="col-form-label">Folio:</label>
        </div>      
        <div class="col-sm-2 justify-content-sm-start">
          <input type="text" readonly class="form-control-plaintext" id="folio" value="PRPD-A02-1" />
        </div>
      </div>
      

      <div class="card w-100 mb-3">
        <div class="card-header">Datos Generales</div>

        <div class="card-body">
          

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="tipoPersona" class="form-label">Tipo Persona:</label>
              <select id="tipoPersona" class="form-select">
                <option selected>Seleccione una opción</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="regimenFiscal" class="form-label">Regimen Fiscal:</label>
              <select id="regimenFiscal" class="form-select">
                <option selected>Seleccione una opción</option>
              </select>
            </div>
          </div>

          <div class="row g-3 justify-content-sm-start mb-3">
            <div class="col-md-6">
              <label for="tipoPersona" class="form-label">Registro Federal de Contribuyentes [RFC]:</label>
              <div class="input-group">
                <input type="text" class="form-control" size="4" />
                <span class="input-group-text">-</span>
                <input type="text" class="form-control" size="6" />
                <span class="input-group-text">-</span>
                <input type="text" class="form-control" size="3" />
              </div>
            </div>
          </div>

          <div class="row g-3 justify-content-sm-start mb-3">
            <div class="col-md-12">
              <h6 class="h6">Representante Legal</h6>
            </div>
            <div class="col-md-4">
              <label for="nombre" class="form-label">Nombre:</label>
              <input type="text" class="form-control" id="nombre" placeholder="Nombre(s)" />
            </div>
            <div class="col-md-4">
              <label for="apellidoPaterno" class="form-label">Apellido Paterno:</label>
              <input type="text" class="form-control" id="apellidoPaterno" placeholder="Apellido Paterno" />
            </div>
            <div class="col-md-4">
              <label for="apellidoMaterno" class="form-label">Apellido Materno:</label>
              <input type="text" class="form-control" id="apellidoMaterno" placeholder="Apellido Materno" />
            </div>

            <div class="col-md-8">
              <label for="giro" class="form-label">Giro:</label>
              <input type="text" class="form-control" id="giro" placeholder="Giro" />
            </div>
            <div class="col-md-4">
              <label for="pyme" class="form-label">Pyme:</label>
              <select id="pyme" class="form-select">
                <option selected>Seleccione una opción</option>
              </select>
            </div>
          </div>
        </div>
      </div>


      <div class="card w-100">
        <div class="card-header">Domicilio Fiscal</div>

        <div class="card-body">
          <div class="row g-3 justify-content-sm-start mb-3">
            <div class="col-sm-6 justify-content-sm-start ">
              <label for="estado" class="col-form-label">Estado:</label>
              <select id="estado" class="form-select">
                <option selected>Seleccione una opción</option>
              </select>
            </div>
            <div class="col-sm-6 justify-content-sm-start">
              <label for="municipio" class="col-form-label">Municipio:</label>
              <select id="municipio" class="form-select">
                <option selected>Seleccione una opción</option>
              </select>
            </div>

            <div class="col-md-6">
              <label for="calle" class="form-label">Calle:</label>
              <input type="text" class="form-control" id="calle" placeholder="Calle" />
            </div>

            <div class="col-md-3">
              <label for="noExterior" class="form-label"># Exterior:</label>
              <input type="text" class="form-control" id="noExterior" placeholder="" />
            </div>
            <div class="col-md-3">
              <label for="noInterior" class="form-label"># Interior:</label>
              <input type="text" class="form-control" id="noInterior" placeholder="" />
            </div>
          </div>

          <div class="col-md-6">
            <label for="colonia" class="form-label">Colonia:</label>
            <input type="text" class="form-control" id="colonia" placeholder="Colonia" />
          </div>

          <div class="col-md-3">
            <label for="codigoPostal" class="form-label">Codigo Postal:</label>
            <input type="text" class="form-control" id="codigoPostal" placeholder="" />
          </div>

        </div>
      </div>
  </div>

  </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>
</body>

</html>
