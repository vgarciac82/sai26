<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Valida Pagos PROFOEM</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet"
	href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
<style>
td {
	cursor: pointer;
}
</style>
</head>
<body class="bg-light">
	<div class="container mt-4">
		<h2 class="mb-4">Valida Pagos PROFOEM</h2>

		<div class="card mb-3">
			<div
				class="card-header d-flex justify-content-between align-items-center">
				<span>Pagos Pendientes</span>
				<div>
					<input type="checkbox" id="selectAll" class="form-check-input me-2">
					<label for="selectAll" class="form-check-label">Seleccionar
						Todos</label>
				</div>
			</div>
			<div class="card-body">
				<table id="tablaPagos" class="table table-striped table-bordered"
					style="width: 100%">
					<thead class="table-light">
						<tr>
							<th>Seleccionar</th>
							<th>SAI</th>
							<th>Trámite</th>
							<th>Folio</th>
							<th>Contrarecibo</th>
							<th>Contrato</th>
							<th>Beneficiario</th>
							<th>Monto</th>
							<th>Concepto</th>
						</tr>
					</thead>
					<tbody>
						<!-- Ejemplo de renglón -->
						<tr data-id="1">
							<td><input type="checkbox" class="form-check-input chkPago"
								value="1"></td>
							<td>123</td>
							<td>Trámite A</td>
							<td>F1234</td>
							<td>CR987</td>
							<td>C001</td>
							<td>Juan Pérez</td>
							<td>$1,500.00</td>
							<td>Pago de servicio</td>
						</tr>
						<!-- Más renglones aquí -->
					</tbody>
				</table>
				<small class="text-muted">*Doble clic en el renglón para ver
					el detalle</small>
			</div>
		</div>

		<div class="card">
			<div class="card-header">Acciones</div>
			<div class="card-body text-center">
				<button id="btnAprobar" class="btn btn-success me-2">Aprobar
					Seleccionados</button>
				<button id="btnRechazar" class="btn btn-danger">Rechazar
					Seleccionados</button>
			</div>

		</div>
	</div>

	<!-- Scripts -->
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script
		src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
	<script
		src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

	<script>
        $(document).ready(function () {
            const tabla = $('#tablaPagos').DataTable();

            $('#selectAll').on('change', function () {
                const isChecked = $(this).is(':checked');
                $('.chkPago').prop('checked', isChecked);
            });

            $('#tablaPagos tbody').on('click', 'input.chkPago', function (e) {
                e.stopPropagation();
            });

            $('#tablaPagos tbody').on('dblclick', 'tr', function () {
                const id = $(this).data('id');
                Swal.fire({
                    title: 'Detalle del pago',
                    text: 'Aquí se mostraría el detalle del pago con ID: ' + id,
                    icon: 'info'
                });
            });

            function getPagosSeleccionados() {
                return $('.chkPago:checked').map(function () {
                    return $(this).val();
                }).get();
            }

            $('#btnAprobar').on('click', function () {
                const pagos = getPagosSeleccionados();
                if (pagos.length === 0) {
                    Swal.fire('Aviso', 'Selecciona al menos un pago para aprobar.', 'warning');
                    return;
                }

                Swal.fire({
                    title: '¿Aprobar pagos?',
                    text: 'Se aprobarán ' + pagos.length + ' pagos seleccionados.',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonText: 'Sí, aprobar',
                    cancelButtonText: 'Cancelar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        console.log("Aprobando: ", pagos);
                        Swal.fire('Aprobados', 'Pagos aprobados correctamente.', 'success');
                    }
                });
            });

            $('#btnRechazar').on('click', function () {
                const pagos = getPagosSeleccionados();
                if (pagos.length === 0) {
                    Swal.fire('Aviso', 'Selecciona al menos un pago para rechazar.', 'warning');
                    return;
                }

                Swal.fire({
                    title: '¿Rechazar pagos?',
                    text: 'Se rechazarán ' + pagos.length + ' pagos seleccionados.',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: 'Sí, rechazar',
                    cancelButtonText: 'Cancelar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        console.log("Rechazando: ", pagos);
                        Swal.fire('Rechazados', 'Pagos rechazados correctamente.', 'success');
                    }
                });
            });
        });
    </script>
</body>
</html>
