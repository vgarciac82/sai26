<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Montos de pago directo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.datatables.net/1.13.5/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
    <link href="../css/sai.css" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.2.1/themes/default/style.min.css" />
</head>

<body>
    <div class="container mt-3 h-100">
        <form>
            <h1>Reporte de montos de pago directo.</h1>

            <div class="card w-100 mx-auto mt-2" id="accountCard">
                <div class="card-header">Filtros</div>
                <div class="card-body">
                    <div class="row g-3 mb-2">
                        <div class="col-12">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" role="switch" id="consolidado" />
                                <label class="form-check-label" for="consolidado">Reporte Consolidado</label>
                            </div>
                        </div>
                    </div>

                    <div class="row g-3 mb-2" id="ueDiv">
                        <div class="col-8">
                            <label for="unidadEjecutora" class="form-label">Unidad Ejecutora</label>
                            <select class="form-select" aria-label="Unidad Ejecutora" id="unidadEjecutora"></select>
                        </div>
                    </div>

                    <div class="row g-3 mb-2">
                        <div class="col-8">
                            <label for="partida" class="form-label">Partida</label>
                            <select class="form-select" aria-label="Partida" id="partida"></select>
                        </div>
                    </div>

                    <div class="row g-3 mb-2">
                        <div class="col-4">
                            <label for="rfc" class="form-label">RFC</label>
                            <input type="text" class="form-control" id="rfc" placeholder="AAAA000000AAA" />
                        </div>
                        <div class="col-6">
                            <label for="razonSocial" class="form-label">Razon Social</label>
                            <input type="text" class="form-control" id="razonSocial" placeholder="AAAA000000AAA" />
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-4 offset-lg-4">
                            <button class="btn btn-primary" type="button" id="filtrar">
                                Filtrar
                            </button>
                            <button class="btn btn-primary" type="button" id="limpiar">
                                Limpiar
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card w-100 mx-auto mt-2" id="accountCard">
                <div class="card-header">
                    Montos pagados a Proveedores por Pago Directo
                </div>
                <div class="card-body">
                    <div id="pagosTblDiv">
                        <table id="pagosTbl" class="table table-striped" style="width: 100%">
                            <thead>
                                <tr>
                                    <th>RFC</th>
                                    <th>Razon Social</th>
                                    <th>Partida</th>
                                    <th>Unidad Ejecutora</th>
                                    <th>Pagado</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>

                    <div id="pagosTbConslDiv" style="display: none;">
                        <table id="pagosConsolidadoTbl" class="table table-striped" style="width: 100%">
                            <thead>
                                <tr>
                                    <th>RFC</th>
                                    <th>Razon Social</th>
                                    <th>Partida</th>
                                    <th>Pagado</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>

                </div>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.2/js/jquery.dataTables.js"></script>
    <script src="https://cdn.datatables.net/1.13.5/js/dataTables.bootstrap5.min.js"></script>

    <script src="https://kit.fontawesome.com/aad2c3aad1.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.2.1/jstree.min.js"></script>
    <script src="../Generador/js/jquery.blockUI-2.70.0.js"></script>
    <script src="../Generador/js/crud.js"></script>

    <script type="text/javascript">
        $.fn.dataTable.ext.legacy.ajax = true;
        const dtPagosURL = window.location.protocol + "//" + window.location.host + "/" + window.location.pathname.split("/")[1] + "/crud?rt=t&ql=v_pagos_directos_acumulado_ue";
        const dtPagosConsolidadoURL = window.location.protocol + "//" + window.location.host + "/" + window.location.pathname.split("/")[1] + "/crud?rt=t&ql=v_pagos_directos_acumulado";

        let pagosTbl;
        let pagosConsolidadoTbl;

        $(document).ready(function () {

            $("#filtrar").on("click", function () {
                filtrar();
            });

            $("#limpiar").on("click", function () {
                clearFilters();
                filtrar();
            });



            pagosTbl = new DataTable("#pagosTbl", {
                serverSide: true,

                searching: false,
                ajax: {
                    url:
                        dtPagosURL,
                    type: "POST",
                },
                aoColumnDefs: [{ bSortable: false, aTargets: [1] }],
                aoColumns: [
                    { name: "RFC" },
                    { name: "RazonSocial" },
                    { name: "cpartida" },
                    { name: "cunidadejecutora" },
                    { name: "mImporteMasIva" },
                ],
                aaSorting: [[4, "desc"]],
                processing: true,
                serverSide: true,
            });

            querySelectPost({
                queryName: "cat_ue_Excepcion300Umas",
                async: true,
                targetObjectId: "unidadEjecutora",
                callback: function () {

                }
            });

            querySelectPost({
                queryName: "cat_partida_Excepcion300Umas_Report",
                async: true,
                targetObjectId: "partida",
                callback: function () {

                }
            });


        });

        const createDTConsolidado = function () {
            if (!pagosConsolidadoTbl) {
                pagosConsolidadoTbl = new DataTable("#pagosConsolidadoTbl", {
                    serverSide: true,

                    searching: false,
                    ajax: {
                        url:
                            dtPagosConsolidadoURL,
                        type: "POST",
                    },
                    aoColumnDefs: [{ bSortable: false, aTargets: [1] }],
                    aoColumns: [
                        { name: "RFC" },
                        { name: "RazonSocial" },
                        { name: "cpartida" },
                        { name: "mImporteMasIva" },
                    ],
                    aaSorting: [[3, "desc"]],
                    processing: true,
                    serverSide: true,
                });
            } else {
                pagosConsolidadoTbl.ajax.url(dtPagosConsolidadoURL).load();
            }

        }

        $("#consolidado").on("click", function () {
            clearFilters();
            if ($(this).is(":checked")) {

                $("#pagosTblDiv").hide();
                $("#pagosTbConslDiv").show();
                $("#ueDiv").hide();
                createDTConsolidado();
            } else {

                $("#pagosTblDiv").show();
                $("#pagosTbConslDiv").hide();
                $("#ueDiv").show();
                pagosTbl.ajax.url(dtPagosURL).load();
            }
        });

        const filtrar = function () {
            let ue = $("#unidadEjecutora").val();
            let partida = $("#partida").val();
            let rfc = $("#rfc").val();
            let razonSocial = $("#razonSocial").val();
            let tokenCond = "";
            let tokenParam = "&qw=";
            let cond = "";

            let urlFilter = dtPagosURL;

            if ($("#consolidado").is(":checked"))
                urlFilter = dtPagosConsolidadoURL;


            if (ue != "0") {
                cond += "cunidadejecutora='" + ue + "'";
                tokenCond = " AND ";
            }

            if (partida != "0") {
                cond += tokenCond + " cpartida = '" + partida + "'";
                tokenCond = " AND ";
            }

            if (rfc != "") {
                cond += tokenCond + " RFC LIKE '%" + rfc + "%'";
                tokenCond = " AND ";
            }

            if (razonSocial != "") {
                cond += tokenCond + " RazonSocial LIKE '%" + razonSocial + "%'";
            }

            if (cond != "")
                urlFilter += tokenParam + encodeURIComponent(cond);
            if ($("#consolidado").is(":checked"))
                pagosConsolidadoTbl.ajax.url(urlFilter).load();
            else
                pagosTbl.ajax.url(urlFilter).load();

        }
        const clearFilters = function () {
            $("#unidadEjecutora").val("0");
            $("#partida").val("0");
            $("#rfc").val("");
            $("#razonSocial").val("");
        }


    </script>
</body>

</html>
